[project]
name = "llmpool"
version = "0.1.0"
description = "Private pool of friends' and family's devices serving local LLMs over a tailnet"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "cryptography>=43",
    "psutil>=6.0",
    "pywin32>=306; sys_platform == 'win32'",
    "nvidia-ml-py>=12.560",
    "pydantic-ai-slim[openai]>=1.0",
    "tomli-w>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coordinator", "node_agent", "poolclient", "orchestrator", "security", "spikes"]
